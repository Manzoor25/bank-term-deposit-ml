# This job runs inside Azure ML, not on the laptop.
# WHY: this subscription turns off public access on every storage account
# and will not let us turn it back on. The laptop cannot upload a model
# file. Compute inside the managed virtual network can, through a private
# endpoint. See DECISIONS.md.
#
# The command downloads the public GitHub repo. It does not upload a local
# folder, because that upload is the step that fails from a laptop.
$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
display_name: train-and-deploy-bank-term-deposit
experiment_name: bank-term-deposit
description: Train three models and deploy the winner. Runs where storage is reachable.
# The curated image's Python is older than 3.11, and pandas 3 requires 3.11+.
# conda create builds a 3.12 environment inside the job. No local upload.
command: >-
  conda create -y -n bank python=3.12 pip &&
  conda run -n bank python -c "import urllib.request, zipfile; urllib.request.urlretrieve('https://github.com/Manzoor25/bank-term-deposit-ml/archive/refs/heads/main.zip', 'src.zip'); zipfile.ZipFile('src.zip').extractall('.')" &&
  cd bank-term-deposit-ml-main &&
  conda run -n bank python -m pip install -r requirements.txt -r requirements-azure.txt &&
  conda run -n bank bash -c "unset MLFLOW_RUN_ID MLFLOW_EXPERIMENT_ID MLFLOW_EXPERIMENT_NAME; export MLFLOW_TRACKING_URI=sqlite:///mlflow.db; python main.py train" &&
  cp -r models/. ${{outputs.model}}/
outputs:
  model:
    type: uri_folder
    mode: upload
compute: azureml:cpu-bank
environment: azureml://registries/azureml/environments/sklearn-1.5/labels/latest
